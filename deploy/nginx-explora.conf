# nginx server block for ex.corfuwebsites.com → 127.0.0.1:8092.
# Install: cp deploy/nginx-explora.conf /etc/nginx/sites-available/ex.corfuwebsites.com
#          ln -s ../sites-available/ex.corfuwebsites.com /etc/nginx/sites-enabled/
#          nginx -t && systemctl reload nginx
#          certbot --nginx -d ex.corfuwebsites.com   (adds the 443 block)
#
# Notes vs the other site blocks on this box:
#  - X-Forwarded-For is OVERWRITTEN with $remote_addr (not $proxy_add_x_forwarded_for):
#    the app trusts the FIRST entry for its login throttle + audit log, and the
#    append idiom would let a client forge it.
#  - client_max_body_size 10m covers the 8 MB raw admin media upload.
#  - Hashed Vite bundles and the ship photo library are served by nginx directly
#    with immutable/long caching, keeping Node out of the static path.

server {
    server_name ex.corfuwebsites.com;

    client_max_body_size 10m;

    # nginx's default gzip_types is text/html ONLY, so without this the JS and
    # CSS bundles (about 450 KB) and every API JSON response ship uncompressed.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        application/javascript
        text/javascript
        application/json
        text/css
        text/plain
        text/xml
        application/xml
        image/svg+xml
        application/manifest+json;

    # Sourcemaps embed the original TypeScript, including the admin console.
    # The build hides them and the deploy excludes them; this is the third layer.
    location ~ \.map$ { return 404; }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Hashed build assets — immutable.
    location ^~ /assets/ {
        alias /opt/explora/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
    }

    # Ship/port photo library (~300 MB, rarely changes).
    location ^~ /photos/ {
        alias /opt/explora/dist/photos/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff";
    }

    location / {
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    listen 80;
    listen [::]:80;
}
